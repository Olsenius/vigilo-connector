name: test og docker

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: pytest -q

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Bygg for røyktest
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: vigilo-gateway:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Røyktest
        run: |
          docker run -d --name smoke --read-only --tmpfs /tmp \
            -e HOST=0.0.0.0 -e PUBLIC_URL=https://vigilo.example -p 8000:8000 vigilo-gateway:ci
          for i in $(seq 1 30); do curl -fs localhost:8000/healthz && break; sleep 1; done
          curl -fs -H 'Host: vigilo.example' localhost:8000/.well-known/oauth-authorization-server
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Host: vigilo.example' localhost:8000/mcp)" = 401
          docker logs smoke 2>&1 | grep -q 'Uvicorn running'
          docker rm -f smoke

      - name: Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/vigilo-connector
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}

      - name: Logg inn på GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Bygg og publiser (amd64 + arm64)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
