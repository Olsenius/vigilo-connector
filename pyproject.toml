[project]
name = "vigilo-connector"
version = "0.1.0"
description = "Personlig MCP-connector mot Vigilo (foreldre-API) — beskjeder, ukesplan m.m."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "mcp>=2.0",
    "pypdf>=4.0",
    "python-docx>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
vigilo-login = "vigilo_connector.login:main"
vigilo-mcp = "vigilo_connector.server:main"
vigilo-gateway = "vigilo_connector.gateway.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vigilo_connector"]

[tool.pytest.ini_options]
testpaths = ["tests"]
anyio_mode = "auto"
