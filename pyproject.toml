[project]
name = "vigilo-mcp"
version = "0.2.0"
description = "Personlig MCP-connector mot Vigilo (foreldre-API) — beskjeder, ukesplan m.m."
requires-python = ">=3.11"
dependencies = [
    "httpx[http2]>=0.27",
    "uvicorn>=0.30",
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-otlp-proto-http>=1.30",
    "mcp>=2.0",
    "pypdf>=4.0",
    "python-docx>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
vigilo-mcp = "vigilo_connector.http_app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vigilo_connector"]

[tool.pytest.ini_options]
testpaths = ["tests"]
anyio_mode = "auto"
