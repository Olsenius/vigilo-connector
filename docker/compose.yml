# Internal backend; connect mcp-gateway to this network and set
# UPSTREAMS=vigilo=http://vigilo:8080 and UPSTREAM_TOKEN_VIGILO to the same token.
services:
  vigilo:
    build: ..
    image: vigilo-mcp:local
    environment:
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:?Set an internal shared token}
      DATA_DIR: /data
      VIGILO_CONFIG_DIR: /data/vigilo
    volumes:
      - data:/data
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
volumes:
  data:
